<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Email preferences | Baja International Realty</title><style>body{margin:0;background:#f2f6f5;color:#243e45;font:17px/1.6 Arial,sans-serif}header{background:#243e45;color:white;padding:20px}main{max-width:600px;margin:40px auto;background:white;padding:28px;border-radius:10px}h1{font-size:28px}button{background:#176b68;color:white;border:0;border-radius:5px;padding:14px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:#176b68}#status{margin:20px 0}@media(max-width:640px){main{margin:20px 12px;padding:22px}}</style></head>
<body><header>Baja International Realty</header><main><h1>Email alert preferences</h1><p>Stop property alert emails? Your saved properties and searches will stay in your account.</p><button id="stop" type="button">Stop my email alerts</button><p id="status" role="status" aria-live="polite"></p><p><a href="/buyer-account.html">Open My Account</a> to manage your saved items and email preferences.</p></main>
<script type="module">
const params=new URLSearchParams(location.search),user=params.get('user')||'',signature=params.get('signature')||'';
const button=document.getElementById('stop'),status=document.getElementById('status');
if(!/^[\da-f-]{36}$/.test(user)||!/^[\da-f]{64}$/.test(signature)){button.hidden=true;status.textContent='This email link is incomplete. Open My Account below to change your preferences.';}
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Turning off email alerts…';
 try{
  const query=new URLSearchParams({action:'unsubscribe',user,signature});
  const response=await fetch('https://uhgruwbaweepkhpydkxa.supabase.co/functions/v1/bir-property-alerts?'+query,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',credentials:'omit'});
  const result=await response.json();if(!response.ok)throw Error(result.error||'Please try again or open My Account to change your preferences.');
  status.textContent=result.message;button.hidden=true;history.replaceState(null,'',location.pathname);
 }catch(error){status.textContent=error.message||'Please try again or open My Account.';button.disabled=false;}
});
</script></body></html>
